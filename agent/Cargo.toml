[package]
name = "vmnotify-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Forward Linux application attention events to a host desktop over SSH"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "time", "signal", "sync"] }
