name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-plan:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Detect Windows version changes on main
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $version = (Get-Content windows/VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'windows/VERSION must be a stable major.minor.patch version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          $publish = $false
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            if ($env:EVENT_NAME -eq 'workflow_dispatch') { $publish = $true }
            elseif ($env:EVENT_NAME -eq 'push') {
              $previous = ''
              if ($env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
                $previous = git show "${env:BEFORE_SHA}:windows/VERSION" 2>$null
                if ($LASTEXITCODE -ne 0) { $previous = ''; $global:LASTEXITCODE = 0 }
              }
              $previous = "$previous".Trim()
              $publish = $version -ne $previous
              if ($previous -match '^\d+\.\d+\.\d+$' -and $publish -and [version]$version -le [version]$previous) {
                throw 'Release version must increase'
              }
            }
          }
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
  windows:
    needs: agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundled-agent-*
          path: artifacts/bundled-agents
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test protocol and SSH arguments
        run: dotnet run --project windows/VMNotify.Tests -c Release
      - name: Validate themes, layout and overlay scrollbar
        shell: pwsh
        run: dotnet run --project windows/VMNotify -c Release -- --preview "$env:RUNNER_TEMP\vmnotify-ui"
      - name: Prepare portable Inno Setup compiler
        shell: pwsh
        run: |
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/tools.innosetup/7.1.0/tools.innosetup.7.1.0.nupkg -OutFile "$env:RUNNER_TEMP\inno.zip"
          Expand-Archive "$env:RUNNER_TEMP\inno.zip" "$env:RUNNER_TEMP\InnoSetup"
          $signature = Get-AuthenticodeSignature "$env:RUNNER_TEMP\InnoSetup\tools\ISCC.exe"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Pyrsys B.V.') { throw 'Invalid compiler signature' }
      - name: Package all Windows architectures
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Iscc "$env:RUNNER_TEMP\InnoSetup\tools\ISCC.exe"
      - name: Verify bundled Linux binaries in every Windows publish directory
        shell: pwsh
        run: |
          foreach ($publish in Get-ChildItem artifacts/publish -Directory) {
            dotnet run --project windows/VMNotify.Tests -c Release -- --bundle-files "$($publish.FullName)/linux-agent"
            if ($LASTEXITCODE) { throw 'Bundled Linux verification failed' }
          }
      - name: Verify install, upgrade, reinstall and downgrade confirmation
        shell: pwsh
        run: |
          $publish = (Get-ChildItem artifacts/publish -Directory -Filter 'win-x64-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          ./scripts/test-installer-state.ps1 -Iscc "$env:RUNNER_TEMP\InnoSetup\tools\ISCC.exe" -PublishDir $publish -OutputDirectory "$env:RUNNER_TEMP\installer-state-tests"
      - name: Verify normal and silent startup
        shell: pwsh
        run: |
          $publish = (Get-ChildItem artifacts/publish -Directory -Filter 'win-x64-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          ./scripts/test-startup.ps1 -PublishDir $publish -OutputDirectory "$env:RUNNER_TEMP\startup-tests"
      - name: Upload installer and UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-windows
          path: |
            ${{ runner.temp }}/installer-state-tests/**/*.log
            ${{ runner.temp }}/vmnotify-ui/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: VMNotify-windows
          path: |
            artifacts/*-setup.exe
            artifacts/*-portable.zip
            artifacts/SHA256SUMS-windows.txt
  agent:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add ${{ matrix.target }}
          sudo apt-get update
          sudo apt-get install -y musl-tools dbus-daemon libglib2.0-bin python3-dbus python3-gi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify repeated flash cycles on an isolated D-Bus
        run: /usr/bin/python3 scripts/test-icon-cycles.py target/${{ matrix.target }}/release/vmnotify-agent
      - name: Verify automatic application discovery
        run: |
          /usr/bin/python3 scripts/test-auto-discovery.py target/${{ matrix.target }}/release/vmnotify-agent
          /usr/bin/python3 scripts/test-auto-discovery.py target/${{ matrix.target }}/release/vmnotify-agent --icon-name
      - name: Verify independent application sampling intervals
        run: /usr/bin/python3 scripts/test-sampling-intervals.py target/${{ matrix.target }}/release/vmnotify-agent
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-agent-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vmnotify-agent
  release:
    needs: [release-plan, windows, agent]
    if: needs.release-plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: VMNotify-windows
          path: release-assets
      - name: Verify all release artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          for arch in x86 x64 arm64; do
            test -s "VMNotify-$RELEASE_VERSION-win-$arch-setup.exe"
            test -s "VMNotify-$RELEASE_VERSION-win-$arch-portable.zip"
            unzip -l "VMNotify-$RELEASE_VERSION-win-$arch-portable.zip" | grep 'linux-agent/x86_64/vmnotify-agent'
            unzip -l "VMNotify-$RELEASE_VERSION-win-$arch-portable.zip" | grep 'linux-agent/aarch64/vmnotify-agent'
            unzip -l "VMNotify-$RELEASE_VERSION-win-$arch-portable.zip" | grep 'linux-agent/manifest.json'
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 7
          for sums in SHA256SUMS-*.txt; do sha256sum -c "$sums"; done
      - name: Publish complete release without replacing existing versions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          git fetch origin --tags
          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA" || { echo 'Version tag belongs to another commit'; exit 1; }
          fi
          if gh release view "$tag" --json isDraft,targetCommitish > release-state.json 2>/dev/null; then
            if test "$(jq -r .isDraft release-state.json)" = false; then
              echo 'This version is already published; leaving it unchanged.'
              exit 0
            fi
            test "$(jq -r .targetCommitish release-state.json)" = "$GITHUB_SHA" || { echo 'Existing draft targets a different commit'; exit 1; }
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "VMNotify $RELEASE_VERSION" --generate-notes --draft
          fi
          gh release upload "$tag" release-assets/* --clobber
          latest=true
          previous_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [[ "$previous_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            highest=$(printf '%s\n%s\n' "${previous_tag#v}" "$RELEASE_VERSION" | sort -V | tail -1)
            if test "$highest" != "$RELEASE_VERSION"; then latest=false; fi
          fi
          gh release edit "$tag" --draft=false --latest="$latest"
